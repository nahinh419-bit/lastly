<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HospiHelp{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
    <div class="header-inner">
        <button class="icon-btn" onclick="toggleMenu()">☰</button>
        <a class="brand" href="{{ url_for('home') }}">Hospi<span>Help</span></a>
        <a class="profile-btn" href="{{ url_for('login') }}">●</a>
    </div>
</header>

<div id="sideMenu" class="side-menu">
    <div class="menu-head">
        <strong>HospiHelp</strong>
        <button onclick="toggleMenu()">×</button>
    </div>
    <a href="{{ url_for('home') }}">⌂ Home</a>
    <a href="{{ url_for('hospitals') }}">▣ Hospital Locator</a>
    <a href="{{ url_for('blood_finder') }}">🩸 Blood Finder</a>
    <a href="{{ url_for('my_appointments') }}">▣ My Appointments</a>
    <a href="{{ url_for('login') }}">⚙ Login</a>
</div>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<main class="page">
    {% block content %}{% endblock %}
</main>

<nav class="bottom-nav">
    <a href="{{ url_for('home') }}" class="active">⌂<small>Home</small></a>
    <a href="{{ url_for('find_specialist') }}">♙<small>Doctors</small></a>
    <a href="{{ url_for('hospitals') }}">▣<small>Hospitals</small></a>
    <a href="{{ url_for('my_appointments') }}">▢<small>Appointments</small></a>
</nav>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
